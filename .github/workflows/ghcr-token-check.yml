name: ghcr token check

# 临时诊断：确认 GITHUB_TOKEN 在 GHCR 上的有效写权限，区分“token 无写权限”与
# “仓库对 debian 包没有 Actions 写权限”。验证完成后删除本文件。
on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Probe GHCR write access
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          resp=$(curl -fsSL -u "x:${GH_TOKEN}" \
            "https://ghcr.io/token?service=ghcr.io&scope=repository:yingquelou/debian:pull,push")
          tok=$(printf '%s' "$resp" | python3 -c 'import json,sys; print(json.load(sys.stdin)["token"])')
          echo "token length: ${#tok}"
          echo "--- debian blob upload ---"
          curl -s -o /tmp/debian.out -w 'http=%{http_code}\n' -X POST \
            -H "Authorization: Bearer $tok" \
            https://ghcr.io/v2/yingquelou/debian/blobs/uploads/
          head -c 300 /tmp/debian.out; echo
          echo "--- new package blob upload ---"
          curl -s -o /tmp/probe.out -w 'http=%{http_code}\n' -X POST \
            -H "Authorization: Bearer $tok" \
            https://ghcr.io/v2/yingquelou/ci-permission-probe/blobs/uploads/
          head -c 300 /tmp/probe.out; echo
